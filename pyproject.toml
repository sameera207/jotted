[project]
name = "rmtasks"
version = "0.1.0"
description = "Read-path spike: find [ ] tasks in a handwritten reMarkable notebook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rmscene>=0.7",
    "rich>=13",
    "anthropic>=1.9.0",
    "typesafe-sdk>=0.7.2",
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
    "flask>=3.1.3",
    "waitress>=3.0.2",
]

[project.scripts]
rmtasks = "rmtasks.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmtasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
