# rmtasks configuration: the single source of settings.
# Copy to config.toml (gitignored). Override the path with RMTASKS_CONFIG.
# Relative paths resolve against this file's folder.
# Detection thresholds are ratios of the median stroke height and are
# starting points for tuning, not measured values.

[paths]
cache_dir   = "./cache"      # downloaded .rmdoc files and unpacked pages
output_dir  = "./out"        # reports, one timestamped folder per run
secrets_dir = "./.secrets"   # created with 0700 permissions

[rmapi]
binary     = "rmapi"                 # name on PATH, or an absolute path
token_file = "./.secrets/rmapi.conf" # passed to rmapi as RMAPI_CONFIG
timeout_s  = 120
trace      = false                   # true sets RMAPI_TRACE=1

[notebook]
name   = "Tasks"   # exact visible name in your library
folder = "/"       # where to search; "/" is the whole library
pages  = "all"     # "all", "last", or a list such as [1, 3]

[strokes]
ignore_tools = ["highlighter", "eraser", "eraser_area"]
min_points   = 2   # drop taps and dots

[lines]
band_tolerance       = 0.6  # centre within this x median height of the band joins it
min_vertical_overlap = 0.5  # or overlap of the band by this share of its own height
tall_stroke_factor   = 3.0  # taller strokes are placed after the first pass
merge_containment    = 0.6  # merge a line into another whose box holds this share of it (drawings); 0 = off
same_row_overlap     = 0.35 # join side-by-side pieces overlapping vertically by this share (a tall letter); 0 = off

[checkbox]
styles    = ["bracket_pair", "single_box"]
lead_zone = 3.0   # search this many line heights from the line's left edge
size_min  = 0.6   # checkbox height vs the line's median stroke height
size_max  = 2.5

# bracket_pair
bracket_aspect_min   = 1.5         # each bracket: height / width
bracket_height_ratio = [0.7, 1.4]  # left vs right bracket
bracket_gap          = [0.3, 2.0]  # gap between brackets, x bracket height
bracket_overlap_min  = 0.7         # vertical overlap of the two brackets

# single_box
box_aspect      = [0.6, 1.6]
box_closure_max = 0.25        # start-to-end distance / box diagonal
box_path_ratio  = [0.7, 1.5]  # stroke length / bbox perimeter

# Checks that must pass or the style is not considered at all. Without a
# gate, ordinary letters pass enough weak checks to clear min_confidence.
# Names: bracket_aspect, height_ratio, overlap, gap, clear_between,
#        box_aspect, closure, path_ratio, clear_inside, size
required_checks = ["bracket_aspect", "gap", "closure"]

require_text   = true  # report an empty checkbox separately
min_confidence = 0.5

# Handwriting to text: one Claude request per page, cached by stroke IDs.
# Page images are sent to Anthropic. Set enabled = false to stay fully local
# (lines are then judged by the geometric checkbox detector above).
[recognition]
enabled     = true
model       = "claude-opus-5"
api_key_env = "ANTHROPIC_API_KEY"   # name of the variable holding the key, never the key
effort      = "low"
timeout_s   = 120

# Line to todo / note / heading: one Jev (TypeSafe) request per page, cached.
[classification]
enabled          = true
model            = "jev-latest"
api_key_env      = "TYPESAFE_API_KEY"
todo_threshold   = 0.6    # P(todo) at or above this makes the line a task
continuation_spacing   = 0.75  # a line this close under another (share of the page's usual line spacing) may continue it
continuation_threshold = 0.25  # ... and is merged unless Jev's P(continues) is below this; geometry leads, Jev vetoes
checkbox_is_task = false  # true: a line starting with a checkbox is a task, whatever Jev says
context_lines    = 2      # neighbouring lines given to Jev on each side
timeout_s        = 30

# The PDF template (write path). A notebook made from it has three zones:
# header (date), body (your tasks) and footer (web tasks, printed by rmtasks).
[template]
pages         = 20      # pages in a new template notebook
header_height = 0.08    # top share of the page: date
footer_height = 0.22    # bottom share of the page: printed web content
line_spacing  = 0.045   # faint ruling in the body, as a share of page height; 0 = none
strike_width  = 1.2     # pt, the printed line through a task done on the web
scale         = 1.0525  # tablet units per nominal unit (1 pt = 3); measured on an rM2 by tracing calibration marks

# The local web app: `rmtasks serve`. It binds to this machine only by default.
[server]
host = "127.0.0.1"
port = 8765
db   = "./data/rmtasks.db"   # SQLite task store (gitignored)
auto_push = true            # push to the tablet after every add, edit or tick (template notebooks only)
auto_push_delay_s = 5       # wait this long after the last change, so quick edits go out as one push
# Watched folders, the action threshold, the poll interval and the To-do document
# are set in the web app (Settings) and stored in the database.

[output]
formats   = ["table", "json", "svg"]
svg_scale = 0.5

[logging]
level = "INFO"
